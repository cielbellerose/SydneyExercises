services:
  postgres:
    image: postgres:16
    container_name: realestate-postgres
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: realestate
    ports:
      - "8000:5432"
    volumes:
      - realestate-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: realestate-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  realestate-pgdata:
